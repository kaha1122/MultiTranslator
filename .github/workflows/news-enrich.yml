# K-뉴스 보강 워커 — Render(공유 DC IP)가 구글 뉴스에서 상시 429라,
# 디코드+기사 이미지 수집만 GH 러너 IP에서 수행해 서버에 패치한다.
# 필요 secret: CRON_SECRET (Render 웹 서비스의 CRON_SECRET과 동일 값)
#
# 2026-07-11 수평 확장(ko 등 비영어 피드 파비콘 고착 해소):
#   ① matrix 3그룹 — 러너마다 IP가 달라 구글 429 예산이 잡별 독립(런당 디코드 30→90)
#   ② 30분 주기 — 피드 수집(Render 크론 2h)과 무관하게 백로그를 계속 소화
#
# 2026-07-12 트리거 이원화(신선 뉴스 이미지 공백 해소):
#   주 트리거 = workflow_dispatch — Render 크론(news-refresh, 짝수 시 정각 UTC)이 갱신
#   완료 직후 API로 기동(routes/news.js dispatchEnrichWorkflow, GH_DISPATCH_TOKEN).
#   schedule(*/30)은 실측상 시간당 1회 수준 + 최장 63분 지연(공용 러너 혼잡 시 스킵)이라
#   신선도 보장용으론 못 쓰고 백로그 청소 폴백으로만 유지.
name: news-enrich

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  enrich:
    runs-on: ubuntu-latest
    # CRON_SECRET이 Production environment secret으로 등록돼 있음 — environment 지정 필수
    environment: Production
    timeout-minutes: 15
    strategy:
      fail-fast: false # 한 그룹 429/실패가 다른 그룹을 중단시키지 않음
      # ⚠ 새 UI 언어 추가 시 여기 matrix에도 분배할 것(2026-07-22 id·ar 누락 사고 —
      #   수집(Render LANG_FEEDS)은 자동 포함되지만 이 목록은 수동이라 이미지가 영영 안 붙음).
      matrix:
        include:
          - name: east   # 비영어 아시아권 — 전부 구글 경유라 디코드 수요 최대
            langs: 'ko,ja,zh-CN,id'
          - name: west
            langs: 'en,vi,fr,de,ar'
          - name: latam
            langs: 'es,ru,pt-BR'
    # 30분 주기 + 15분 타임아웃 — 지연 시 같은 그룹이 겹치지 않게 취소
    concurrency:
      group: news-enrich-${{ matrix.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 의존성 0 스크립트 — npm ci 불필요
      - name: Run enrich worker (${{ matrix.name }})
        env:
          NEWS_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEWS_API_BASE: https://multitranslator.onrender.com
          NEWS_LANGS: ${{ matrix.langs }}
          NEWS_GLOBAL_DECODE: '30'
        run: node server/scripts/news-enrich-worker.js
