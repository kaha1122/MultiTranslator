<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="620" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect width="360" height="54" fill="white"/>
  <text x="18" y="34" font-family="-apple-system,system-ui,sans-serif" font-size="18" font-weight="800" fill="#00a884">PronunFit.</text>
  <rect y="54" width="360" height="1" fill="#f1f5f9"/>

  <!-- Category Toggle -->
  <rect x="12" y="66" width="336" height="40" rx="12" fill="#f1f5f9"/>
  <rect x="16" y="70" width="162" height="32" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="97" y="91" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12" font-weight="600" fill="#00a884">Locations</text>
  <text x="264" y="91" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#64748b">Situations</text>

  <!-- Scene grid row 1 -->
  <!-- Airport -->
  <rect x="12" y="118" width="60" height="62" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="42" y="146" text-anchor="middle" font-size="22">✈️</text>
  <text x="42" y="168" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#475569">Airport</text>

  <!-- Hotel -->
  <rect x="78" y="118" width="60" height="62" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="108" y="146" text-anchor="middle" font-size="22">🏨</text>
  <text x="108" y="168" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#475569">Hotel</text>

  <!-- Restaurant (SELECTED) -->
  <rect x="144" y="118" width="60" height="62" rx="12" fill="#f0fdf9" stroke="#00a884" stroke-width="2"/>
  <text x="174" y="146" text-anchor="middle" font-size="22">🍽️</text>
  <text x="174" y="168" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#00a884" font-weight="700">Restaurant</text>

  <!-- Transport -->
  <rect x="210" y="118" width="60" height="62" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="240" y="146" text-anchor="middle" font-size="22">🚌</text>
  <text x="240" y="168" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#475569">Transport</text>

  <!-- Shopping -->
  <rect x="276" y="118" width="72" height="62" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="312" y="146" text-anchor="middle" font-size="22">🛍️</text>
  <text x="312" y="168" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#475569">Shopping</text>

  <!-- Scene grid row 2 -->
  <rect x="12" y="186" width="60" height="62" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="42" y="214" text-anchor="middle" font-size="22">🏥</text>
  <text x="42" y="236" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#475569">Hospital</text>

  <rect x="78" y="186" width="60" height="62" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="108" y="214" text-anchor="middle" font-size="22">🗺️</text>
  <text x="108" y="236" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#475569">Tourist</text>

  <rect x="144" y="186" width="60" height="62" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="174" y="214" text-anchor="middle" font-size="22">💼</text>
  <text x="174" y="236" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#475569">Office</text>

  <rect x="210" y="186" width="60" height="62" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="240" y="214" text-anchor="middle" font-size="22">🏦</text>
  <text x="240" y="236" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#475569">Bank</text>

  <!-- Custom (indigo, spans 2 cols) -->
  <rect x="276" y="186" width="72" height="62" rx="12" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="312" y="214" text-anchor="middle" font-size="22">✏️</text>
  <text x="312" y="236" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="8" fill="#4f46e5" font-weight="600">Custom</text>

  <!-- Controls box -->
  <rect x="12" y="260" width="336" height="74" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Language pills -->
  <rect x="22" y="270" width="34" height="24" rx="12" fill="#00a884"/>
  <text x="39" y="286" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="white" font-weight="600">EN</text>
  <rect x="62" y="270" width="34" height="24" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="79" y="286" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#475569">KO</text>
  <rect x="102" y="270" width="34" height="24" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="119" y="286" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#475569">JA</text>
  <rect x="142" y="270" width="34" height="24" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="159" y="286" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#475569">ZH</text>
  <!-- Generate button -->
  <rect x="22" y="300" width="316" height="28" rx="9" fill="#00a884"/>
  <text x="180" y="318" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="white" font-weight="700">Generate Sentence</text>

  <!-- Scene Card -->
  <rect x="12" y="346" width="336" height="258" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Score badge -->
  <rect x="258" y="356" width="80" height="24" rx="12" fill="#10b981"/>
  <text x="298" y="372" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="white" font-weight="700">88 Pt</text>

  <!-- Hint bar -->
  <rect x="22" y="356" width="230" height="44" rx="10" fill="#f8fafc"/>
  <rect x="22" y="356" width="3" height="44" rx="1.5" fill="#00a884"/>
  <text x="36" y="374" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#475569">🎬 Restaurant — asking for a table.</text>
  <text x="36" y="391" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#94a3b8">Practice polite English expressions.</text>

  <!-- English sentence -->
  <text x="180" y="428" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Could I have a table for</text>
  <text x="180" y="449" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">two, please?</text>

  <!-- Translation -->
  <text x="180" y="471" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#64748b">두 명 자리 있을까요?</text>

  <!-- Coach tip -->
  <rect x="22" y="482" width="316" height="36" rx="8" fill="#fffbeb"/>
  <rect x="22" y="482" width="3" height="36" rx="1.5" fill="#f59e0b"/>
  <text x="36" y="496" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#92400e">💡 "Could I" sounds more polite than "Can I"</text>
  <text x="36" y="510" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#92400e">in formal settings.</text>

  <!-- Divider -->
  <line x1="22" y1="524" x2="338" y2="524" stroke="#f1f5f9" stroke-width="1"/>

  <!-- TTS button -->
  <circle cx="52" cy="556" r="22" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="52" y="564" text-anchor="middle" font-size="18">🔊</text>

  <!-- Mic button -->
  <circle cx="180" cy="556" r="26" fill="#10b981"/>
  <text x="180" y="564" text-anchor="middle" font-size="20">🎙</text>

  <!-- Star button -->
  <circle cx="308" cy="556" r="22" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="308" y="564" text-anchor="middle" font-size="18">⭐</text>
</svg>
