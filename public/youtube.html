<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #player {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="player"
    allowfullscreen
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    (function() {
      var p = new URLSearchParams(window.location.search);
      var v = p.get('v');
      if (!v) { document.body.innerHTML = '<div style="color:#fff;padding:20px">Missing video ID</div>'; return; }
      var q = new URLSearchParams({
        autoplay: p.get('autoplay') || '1',
        controls: '1',
        rel: '0',
        modestbranding: '1',
        playsinline: '1',
        enablejsapi: '1',
        origin: window.location.origin
      });
      if (p.get('hl')) q.append('hl', p.get('hl'));
      if (p.get('cc_load_policy')) q.append('cc_load_policy', p.get('cc_load_policy'));
      document.getElementById('player').src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v) + '?' + q.toString();
    })();
  </script>
</body>
</html>
